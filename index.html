<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Demo - heheheheheh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .subtitle {
            color: #999;
            font-size: 1.1em;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .demo-section {
            margin: 30px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .demo-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            color: #333;
            font-weight: 500;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .emoji {
            font-size: 3em;
            margin: 20px 0;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .color-box {
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: 600;
            color: white;
        }

        .color-box:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 欢迎来到 Demo</h1>
        <p class="subtitle">一个交互式的 HTML 演示页面</p>

        <!-- 问候区域 -->
        <div class="demo-section">
            <h2>👋 问候</h2>
            <input type="text" id="nameInput" placeholder="输入你的名字...">
            <button onclick="greet()">点击问候</button>
            <div class="result" id="greetResult"></div>
        </div>

        <!-- 计算器 -->
        <div class="demo-section">
            <h2>🧮 简单计算器</h2>
            <input type="number" id="num1" placeholder="第一个数字">
            <input type="number" id="num2" placeholder="第二个数字">
            <div>
                <button onclick="calculate('add')">相加</button>
                <button onclick="calculate('subtract')">相减</button>
                <button onclick="calculate('multiply')">相乘</button>
                <button onclick="calculate('divide')">相除</button>
            </div>
            <div class="result" id="calcResult"></div>
        </div>

        <!-- 颜色选择器 -->
        <div class="demo-section">
            <h2>🎨 颜色选择器</h2>
            <div class="color-grid">
                <div class="color-box" style="background: #667eea;" onclick="changeColor('#667eea')">蓝紫色</div>
                <div class="color-box" style="background: #f093fb;" onclick="changeColor('#f093fb')">粉红色</div>
                <div class="color-box" style="background: #4facfe;" onclick="changeColor('#4facfe')">天蓝色</div>
                <div class="color-box" style="background: #43e97b;" onclick="changeColor('#43e97b')">绿色</div>
                <div class="color-box" style="background: #fa709a;" onclick="changeColor('#fa709a')">红色</div>
                <div class="color-box" style="background: #feca57;" onclick="changeColor('#feca57'); color: #333;">黄色</div>
            </div>
        </div>

        <!-- 计数器 -->
        <div class="demo-section">
            <h2>📊 计数器</h2>
            <div class="emoji" id="counter">0</div>
            <button onclick="increment()">➕ 增加</button>
            <button onclick="decrement()">➖ 减少</button>
            <button onclick="resetCounter()">🔄 重置</button>
        </div>

        <div class="footer">
            <p>✨ 由 GitHub Copilot 创建 | 部署在 GitHub Pages</p>
        </div>
    </div>

    <script>
        let count = 0;

        // 问候函数
        function greet() {
            const name = document.getElementById('nameInput').value;
            const result = document.getElementById('greetResult');
            
            if (name.trim() === '') {
                result.textContent = '😊 请输入你的名字！';
            } else {
                result.textContent = `👋 你好，${name}！很高兴认识你！`;
            }
            result.classList.add('show');
        }

        // 计算函数
        function calculate(operation) {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const result = document.getElementById('calcResult');

            if (isNaN(num1) || isNaN(num2)) {
                result.textContent = '❌ 请输入有效的数字！';
                result.classList.add('show');
                return;
            }

            let answer;
            switch(operation) {
                case 'add':
                    answer = num1 + num2;
                    break;
                case 'subtract':
                    answer = num1 - num2;
                    break;
                case 'multiply':
                    answer = num1 * num2;
                    break;
                case 'divide':
                    answer = num2 !== 0 ? num1 / num2 : '不能除以零！';
                    break;
            }

            result.textContent = `📈 结果: ${answer}`;
            result.classList.add('show');
        }

        // 颜色变换函数
        function changeColor(color) {
            document.body.style.background = `linear-gradient(135deg, ${color} 0%, ${adjustColor(color, -20)} 100%)`;
        }

        // 调整颜色亮度
        function adjustColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, Math.max(0, (num >> 16) + amt));
            const G = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + amt));
            const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        // 计数器函数
        function increment() {
            count++;
            updateCounter();
        }

        function decrement() {
            count--;
            updateCounter();
        }

        function resetCounter() {
            count = 0;
            updateCounter();
        }

        function updateCounter() {
            document.getElementById('counter').textContent = count;
        }

        // 回车键支持
        document.getElementById('nameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                greet();
            }
        });
    </script>
</body>
</html>
