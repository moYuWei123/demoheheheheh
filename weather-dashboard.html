<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard - 天气仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 400px;
            min-width: 250px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        button {
            padding: 12px 25px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .location-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .location-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .location-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .current-weather {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .location-name {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .update-time {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 4em;
        }

        .weather-info {
            flex: 1;
        }

        .temperature {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .weather-description {
            font-size: 1.3em;
            text-transform: capitalize;
            opacity: 0.95;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.5em;
            font-weight: 600;
        }

        .forecast-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        .forecast-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .forecast-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .forecast-item:hover {
            background: #e8eaf6;
            border-color: #667eea;
            transform: translateY(-5px);
        }

        .forecast-time {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 2em;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 1.1em;
            color: #333;
            font-weight: 600;
        }

        .forecast-description {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
            text-transform: capitalize;
        }

        .error-message {
            background: #fff3cd;
            color: #856404;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
            animation: slideDown 0.3s ease-out;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            animation: slideDown 0.3s ease-out;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .chart-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .temp-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 200px;
            gap: 10px;
            margin-top: 20px;
        }

        .temp-bar {
            flex: 1;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px 8px 0 0;
            min-height: 20px;
            position: relative;
            transition: all 0.3s;
        }

        .temp-bar:hover {
            opacity: 0.8;
        }

        .temp-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            color: #333;
            white-space: nowrap;
        }

        .temp-value {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 600;
            color: #667eea;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.8;
        }

        .api-info {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .weather-main {
                flex-direction: column;
                gap: 20px;
            }

            .weather-icon {
                font-size: 3em;
            }

            .temperature {
                font-size: 2.5em;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>实时天气查询仪表板</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="输入城市名称..." value="Beijing">
                <button onclick="searchWeather()">🔍 搜索</button>
            </div>
        </div>

        <div class="location-buttons">
            <button class="location-btn" onclick="searchCity('London')">🇬🇧 London</button>
            <button class="location-btn" onclick="searchCity('New York')">🇺🇸 New York</button>
            <button class="location-btn" onclick="searchCity('Tokyo')">🇯🇵 Tokyo</button>
            <button class="location-btn" onclick="searchCity('Paris')">🇫🇷 Paris</button>
            <button class="location-btn" onclick="searchCity('Sydney')">🇦🇺 Sydney</button>
        </div>

        <div id="messageContainer"></div>

        <div id="weatherContainer"></div>

        <div class="api-info">
            <p>📡 数据来自 Open-Meteo API (无需 API Key)</p>
            <p style="font-size: 0.9em; margin-top: 5px; opacity: 0.8;">Weather data from Open-Meteo | Geocoding from Nominatim</p>
        </div>
    </div>

    <script>
        // API 配置
        const GEOCODING_API = 'https://nominatim.openstreetmap.org/search?format=json&q=';
        const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';

        // 天气图标映射
        const weatherIcons = {
            'clear': '☀️',
            'partly cloudy': '⛅',
            'cloudy': '☁️',
            'overcast': '☁️',
            'rain': '🌧️',
            'drizzle': '🌦️',
            'thunderstorm': '⛈️',
            'snow': '❄️',
            'fog': '🌫️',
            'mist': '🌫️'
        };

        // 获取天气图标
        function getWeatherIcon(description) {
            const desc = description.toLowerCase();
            for (let key in weatherIcons) {
                if (desc.includes(key)) {
                    return weatherIcons[key];
                }
            }
            return '🌡️';
        }

        // 显示消息
        function showMessage(message, type = 'success') {
            const container = document.getElementById('messageContainer');
            const messageClass = type === 'error' ? 'error-message' : 'success-message';
            container.innerHTML = `<div class="${messageClass}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // 显示加载状态
        function showLoading() {
            const container = document.getElementById('weatherContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在获取天气数据...</p>
                </div>
            `;
        }

        // 获取城市坐标
        async function getCoordinates(cityName) {
            try {
                const response = await fetch(GEOCODING_API + encodeURIComponent(cityName));
                const data = await response.json();

                if (data.length === 0) {
                    showMessage(`找不到城市: ${cityName}`, 'error');
                    return null;
                }

                return {
                    name: data[0].name,
                    lat: data[0].lat,
                    lon: data[0].lon,
                    country: data[0].address?.country || ''
                };
            } catch (error) {
                console.error('地理编码错误:', error);
                showMessage('获取城市坐标失败', 'error');
                return null;
            }
        }

        // 获取天气数据
        async function getWeather(lat, lon, cityName) {
            try {
                const params = new URLSearchParams({
                    latitude: lat,
                    longitude: lon,
                    current: 'temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,apparent_temperature',
                    hourly: 'temperature_2m,weather_code,precipitation,humidity,weather_code',
                    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max',
                    temperature_unit: 'celsius',
                    wind_speed_unit: 'kmh',
                    timezone: 'auto'
                });

                const response = await fetch(`${WEATHER_API}?${params}`);
                const data = await response.json();

                if (!data.current) {
                    throw new Error('无效的天气数据');
                }

                return {
                    cityName: cityName,
                    current: data.current,
                    hourly: data.hourly,
                    daily: data.daily,
                    timezone: data.timezone
                };
            } catch (error) {
                console.error('天气数据获取错误:', error);
                showMessage('获取天气数据失败', 'error');
                return null;
            }
        }

        // WMO 天气代码映射
        function getWeatherDescription(code) {
            const codes = {
                0: '晴天',
                1: '主要晴天',
                2: '部分多云',
                3: '阴天',
                45: '雾',
                48: '沉降雾',
                51: '轻毛毛雨',
                53: '中毛毛雨',
                55: '密集毛毛雨',
                61: '轻雨',
                63: '中雨',
                65: '大雨',
                71: '轻雪',
                73: '中雪',
                75: '大雪',
                80: '轻阵雨',
                81: '中阵雨',
                82: '大阵雨',
                85: '轻阵雪',
                86: '大阵雪',
                95: '雷暴',
                96: '有冰雹的雷暴',
                99: '有大冰雹的雷暴'
            };
            return codes[code] || '未知';
        }

        // 渲染天气界面
        function renderWeather(weatherData) {
            const container = document.getElementById('weatherContainer');
            const current = weatherData.current;
            const daily = weatherData.daily;
            const hourly = weatherData.hourly;

            const weatherDesc = getWeatherDescription(current.weather_code);
            const icon = getWeatherIcon(weatherDesc);

            const now = new Date();
            const updateTime = now.toLocaleString('zh-CN');

            let html = `
                <div class="weather-card current-weather">
                    <div class="location-name">${weatherData.cityName}</div>
                    <div class="update-time">更新于: ${updateTime}</div>
                    
                    <div class="weather-main">
                        <div class="weather-icon">${icon}</div>
                        <div class="weather-info">
                            <div class="temperature">${Math.round(current.temperature_2m)}°C</div>
                            <div class="weather-description">${weatherDesc}</div>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">体感温度</div>
                            <div class="detail-value">${Math.round(current.apparent_temperature)}°C</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">湿度</div>
                            <div class="detail-value">${current.relative_humidity_2m}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">风速</div>
                            <div class="detail-value">${Math.round(current.wind_speed_10m)} km/h</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">风向</div>
                            <div class="detail-value">${getWindDirection(current.wind_direction_10m)}</div>
                        </div>
                    </div>
                </div>
            `;

            // 每小时预报
            if (hourly && hourly.time) {
                html += `
                    <div class="forecast-section">
                        <div class="forecast-title">📅 每小时预报 (24小时)</div>
                        <div class="forecast-grid">
                `;

                for (let i = 0; i < Math.min(24, hourly.time.length); i++) {
                    const time = new Date(hourly.time[i]);
                    const timeStr = time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    const temp = hourly.temperature_2m[i];
                    const code = hourly.weather_code[i];
                    const desc = getWeatherDescription(code);
                    const icon = getWeatherIcon(desc);

                    html += `
                        <div class="forecast-item">
                            <div class="forecast-time">${timeStr}</div>
                            <div class="forecast-icon">${icon}</div>
                            <div class="forecast-temp">${Math.round(temp)}°C</div>
                            <div class="forecast-description">${desc}</div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            // 7天预报
            if (daily && daily.time) {
                html += `
                    <div class="forecast-section">
                        <div class="forecast-title">📆 7天预报</div>
                        <div class="forecast-grid">
                `;

                for (let i = 0; i < Math.min(7, daily.time.length); i++) {
                    const date = new Date(daily.time[i]);
                    const dateStr = date.toLocaleDateString('zh-CN', { weekday: 'short', month: 'short', day: 'numeric' });
                    const maxTemp = daily.temperature_2m_max[i];
                    const minTemp = daily.temperature_2m_min[i];
                    const code = daily.weather_code[i];
                    const desc = getWeatherDescription(code);
                    const icon = getWeatherIcon(desc);

                    html += `
                        <div class="forecast-item">
                            <div class="forecast-time">${dateStr}</div>
                            <div class="forecast-icon">${icon}</div>
                            <div class="forecast-temp">${Math.round(maxTemp)}°/${Math.round(minTemp)}°</div>
                            <div class="forecast-description">${desc}</div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            // 温度趋势图表
            if (daily && daily.time) {
                html += `
                    <div class="chart-container">
                        <div class="chart-title">📈 7天温度趋势</div>
                        <div class="temp-chart">
                `;

                const maxTemp = Math.max(...daily.temperature_2m_max);
                const minTemp = Math.min(...daily.temperature_2m_min);
                const range = maxTemp - minTemp || 1;

                for (let i = 0; i < Math.min(7, daily.time.length); i++) {
                    const date = new Date(daily.time[i]);
                    const dateStr = date.toLocaleDateString('zh-CN', { weekday: 'short' });
                    const temp = daily.temperature_2m_max[i];
                    const height = ((temp - minTemp) / range) * 100;

                    html += `
                        <div style="flex: 1; position: relative; height: 100%;">
                            <div class="temp-bar" style="height: ${Math.max(height, 10)}%;">
                                <div class="temp-value">${Math.round(temp)}°</div>
                            </div>
                            <div class="temp-label">${dateStr}</div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            showMessage(`✅ 成功获取 ${weatherData.cityName} 的天气数据`, 'success');
        }

        // 获取风向
        function getWindDirection(degree) {
            const directions = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];
            const index = Math.round(degree / 45) % 8;
            return directions[index];
        }

        // 搜索天气
        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                showMessage('请输入城市名称', 'error');
                return;
            }
            await getWeatherByCity(city);
        }

        // 通过城市名获取天气
        async function getWeatherByCity(cityName) {
            showLoading();
            const coords = await getCoordinates(cityName);
            if (!coords) return;

            const weather = await getWeather(coords.lat, coords.lon, coords.name);
            if (!weather) return;

            renderWeather(weather);
        }

        // 搜索指定城市
        function searchCity(cityName) {
            document.getElementById('cityInput').value = cityName;
            getWeatherByCity(cityName);
        }

        // 页面加载时获取默认城市天气
        window.addEventListener('load', () => {
            getWeatherByCity('Beijing');
        });

        // 回车键搜索
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });
    </script>
</body>
</html>
